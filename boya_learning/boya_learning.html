<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Boya Chinese Master • Nền Tảng Học Toàn Diện Giáo Trình Boya (6 Quyển · 74 Bài)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Bảng màu & theme dùng chung (nạp đồng bộ để không chớp màu) -->
    <link rel="stylesheet" href="../shared/theme.css">
    <script src="../shared/theme.js"></script>
    <!-- Main Style -->
    <link rel="stylesheet" href="boya_learning.css">
</head>
<body>

    <!-- 1. TOP APP HEADER -->
    <header class="boya-header">
        <div class="header-left">
            <button class="header-btn header-btn-sidebar" id="hdrSidebarToggleBtn" title="Đóng / Mở danh mục bài học (Ctrl + B)">
                <span class="bst-icon">☰</span>
                <span class="bst-text">Danh mục bài</span>
            </button>

            <a href="../index.html" class="header-btn header-btn-home" title="Về trang chủ chọn tài liệu">
                <span>←</span>
                <span class="home-text">Trang Chủ</span>
            </a>

            <div class="brand-wrap">
                <span class="brand-icon">🏮</span>
                <div class="brand-titles">
                    <h1>
                        <span class="brand-name">Boya Chinese</span>
                        <span class="brand-badge">Full</span>
                    </h1>
                    <div class="brand-sub">Hệ Thống Học Giáo Trình Boya Toàn Diện (6 Quyển · 74 Bài · 4.472 Từ Vựng)</div>
                </div>
            </div>
        </div>

        <!-- Book Switcher Nav Pills -->
        <nav class="book-pills-nav" id="bookPillsNav" aria-label="Chọn Quyển Giáo Trình Boya">
            <!-- Populated dynamically via JS -->
        </nav>

        <div class="header-right">
            <!-- Global Search Trigger -->
            <button class="header-search-btn" id="globalSearchBtn" title="Tìm kiếm bài học và từ vựng (Ctrl + K)">
                <span class="search-btn-label">🔍 <span class="search-btn-text">Tìm kiếm...</span></span>
                <kbd>Ctrl K</kbd>
            </button>

            <!-- Ôn hôm nay: từ đến hạn của mọi bài, mọi quyển -->
            <button class="header-btn review-btn" id="hdrReviewBtn" title="Ôn hôm nay: các từ đến hạn ôn tập (mọi bài, mọi quyển)">
                🔁 <span class="review-btn-text">Ôn hôm nay</span>
                <span class="review-count" id="hdrDueCount" hidden>0</span>
            </button>

            <!-- Streak Pill: bấm để xem thống kê theo ngày -->
            <button class="header-btn streak-pill" id="hdrStreakBtn" title="Chuỗi ngày học thật (≥ 10 câu hoặc 10 thẻ/ngày) · bấm để xem thống kê">
                🔥 <span id="hdrStreakCount">0</span><span class="streak-text-days"> ngày</span>
            </button>

            <!-- Dark / Light Theme Toggle -->
            <button class="header-btn theme-toggle-btn" id="themeToggleBtn" title="Chuyển chế độ Sáng / Tối">
                🌓
            </button>
        </div>
    </header>

    <!-- 2. MAIN 2-COLUMN WORKSPACE -->
    <main class="boya-workspace">
        <!-- Mobile/Tablet Drawer Backdrop -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- LEFT SIDEBAR: LESSON DIRECTORY -->
        <aside class="boya-sidebar" id="boyaSidebar">
            <div class="sidebar-header">
                <div class="sidebar-book-badge-wrap">
                    <div class="sidebar-book-select-wrap">
                        <select id="sidebarBookSelect" class="sidebar-book-select" title="Đổi quyển giáo trình Boya">
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                    <button class="btn-sidebar-close" id="sidebarCloseBtn" title="Thu gọn danh mục bài (Đóng sidebar)">◀</button>
                </div>
                <div class="sidebar-progress-info">
                    <span class="sidebar-progress-label" id="sidebarProgressLabel">0/16 Bài (0%)</span>
                </div>
                <div class="sidebar-progress-bar">
                    <div class="sidebar-progress-fill" id="sidebarProgressFill"></div>
                </div>
            </div>

            <div class="sidebar-filter-wrap">
                <input type="text" class="sidebar-search-input" id="sidebarSearch" placeholder="Tìm bài (VD: Bài 3, E-mail, 生词)...">
                <div class="sidebar-filter-pills">
                    <button class="sf-pill active" data-filter="all">Tất cả</button>
                    <button class="sf-pill" data-filter="todo">Chưa học</button>
                    <button class="sf-pill" data-filter="done">✓ Đã học</button>
                </div>
            </div>

            <div class="sidebar-lesson-list" id="sidebarLessonList">
                <!-- Dynamically populated lessons -->
            </div>
        </aside>

        <!-- RIGHT MAIN PANEL -->
        <section class="boya-main-panel">
            <!-- Lesson Top Banner -->
            <div class="lesson-top-banner">
                <div class="ltb-left">
                    <button class="btn-sidebar-toggle" id="sidebarToggleBtn" title="Đóng / Mở danh mục bài học (Ctrl + B)">
                        ☰ Danh sách bài
                    </button>
                    <div>
                        <div class="lesson-meta-badge" id="lessonMetaBadge">
                            <!-- e.g. 📘 CHUẨN TRUNG CẤP 1 • BÀI 1 / 16 -->
                        </div>
                        <h1 class="lesson-main-title" id="lessonMainTitle">
                            <!-- e.g. 三封E-mail -->
                        </h1>
                        <!-- <div class="lesson-subtitle" id="lessonSubtitle"> -->
                            <!-- Subtitle meta -->
                        <!-- </div> -->
                    </div>
                </div>

                <div class="ltb-right" id="lessonStatusArea">
                    <!-- Trạng thái bài: x/4 bước hoặc Hoàn thành -->
                </div>
            </div>

            <!-- Lộ trình 4 bước của bài: Từ vựng → Bài khóa → Ngữ pháp → Kiểm tra -->
            <div class="lesson-path" id="lessonPath"></div>

            <!-- Mode Tabs Bar (Sticky Top with Fixed Pinyin Toggle) -->
            <div class="mode-tabs-bar">
                <div class="mode-tabs-list" role="tablist">
                    <button class="mode-tab-btn" data-mode="vocab" title="Danh sách từ vựng, loại từ & ví dụ">
                        <span>🏮</span>
                        <span>Từ Vựng</span>
                        <span class="tab-badge" id="tabBadgeVocab">0</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="flashcard" title="Lật thẻ & chấm Quên/Khó/Nhớ/Dễ (bước 1)">
                        <span>🎴</span>
                        <span>Flashcards</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="reading" title="Bài khóa song ngữ, đọc tính giờ, nghe-nhại (bước 2)">
                        <span>📖</span>
                        <span>Bài Khóa</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="grammar" title="Cấu trúc ngữ pháp & điểm ngôn ngữ (bước 3)">
                        <span>📐</span>
                        <span>Ngữ Pháp</span>
                        <span class="tab-badge" id="tabBadgeGrammar">0</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="quiz" title="Trắc nghiệm, nghe chọn từ, ghép cặp">
                        <span>🎯</span>
                        <span>Luyện Tập</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="test" title="Bài kiểm tra cuối bài: đạt ≥ 80% để hoàn thành bài (bước 4)">
                        <span>🏁</span>
                        <span>Kiểm Tra</span>
                    </button>
                    <button class="mode-tab-btn" data-mode="podcast" title="Nghe thụ động rảnh tay">
                        <span>🎧</span>
                        <span>Podcast</span>
                    </button>
                </div>

                <div class="mode-tabs-actions">
                    <button class="btn-tab-pinyin active" id="stickyTogglePinyin" title="Bật / Tắt phiên âm Pinyin (Phím P)">
                        <span class="pinyin-icon">👁️</span>
                        <span class="pinyin-label">Pinyin: <strong id="stickyPinyinStatus">Bật</strong></span>
                    </button>
                </div>
            </div>

            <!-- Dynamic Study Mode Content Container -->
            <div class="mode-content-container" id="modeContentContainer">
                <!-- Populated via JS based on active mode -->
            </div>
        </section>
    </main>

    <!-- 3. STICKY GLOBAL AUDIO PLAYER (BOTTOM) -->
    <div class="boya-audio-dock">
        <audio id="globalAudioElement" preload="metadata"></audio>

        <!-- Track Information -->
        <div class="dock-left">
            <div class="dock-track-icon">🎵</div>
            <div class="dock-track-info">
                <div class="dock-track-title" id="dockTrackTitle">Chưa chọn audio bài học</div>
                <div class="dock-track-sub" id="dockTrackSub">Boya Chinese Audio</div>
            </div>
        </div>

        <!-- Controls & Scrubber Slider -->
        <div class="dock-center">
            <div class="dock-controls-row">
                <button class="btn-player-ctrl" id="btnAudioRewind" title="Lùi 10 giây">⏮ 10s</button>
                <button class="btn-player-ctrl btn-play-pause" id="btnPlayPause" title="Phát / Dừng">▶</button>
                <button class="btn-player-ctrl" id="btnAudioForward" title="Tua tới 10 giây">10s ⏭</button>
            </div>
            <div class="dock-timeline-row">
                <span class="time-label current" id="timeCurrent">00:00</span>
                <input type="range" class="audio-scrubber-slider" id="audioScrubber" value="0" min="0" max="100" step="0.1">
                <span class="time-label total" id="timeTotal">00:00</span>
            </div>
        </div>

        <!-- Speed & Actions -->
        <div class="dock-right">
            <button class="speed-badge-btn" id="btnSpeedToggle" title="Điều chỉnh tốc độ phát âm thanh">
                1.0x
            </button>
            <button class="btn-player-ctrl dock-mini-btn" id="btnPillModeToggle" title="Chuyển chế độ Viên thuốc nổi (Floating Pill) / Thanh đáy">
                💊
            </button>
            <button class="btn-player-ctrl dock-mini-btn" id="btnToggleAudioDock" title="Thu gọn / Mở rộng trình phát nhạc">
                ▾
            </button>
        </div>
    </div>

    <!-- 4. SEARCH MODAL DIALOG (CTRL + K) -->
    <div class="modal-backdrop" id="searchModal">
        <div class="search-modal-dialog">
            <div class="modal-search-input-wrap">
                <span class="modal-search-ico">🔍</span>
                <input type="text" class="modal-search-input" id="modalSearchInput" placeholder="Tìm theo chữ Hán, Pinyin, nghĩa tiếng Việt hoặc số bài...">
                <kbd class="modal-kbd">ESC</kbd>
            </div>
            <div class="modal-results-list" id="modalResultsList">
                <!-- Search results injected here -->
            </div>
        </div>
    </div>

    <!-- 5. MODAL THỐNG KÊ THEO NGÀY -->
    <div class="modal-backdrop" id="statsModal">
        <div class="search-modal-dialog stats-dialog" role="dialog" aria-label="Thống kê học tập">
            <div class="stats-head">
                <span>📊 Thống kê học tập</span>
                <button class="btn-icon-round" data-close-stats title="Đóng (Esc)">✕</button>
            </div>
            <div class="stats-body" id="statsBody"></div>
        </div>
    </div>

    <!-- 6. SCRIPTS: FAST DIRECT DATA + APP LOGIC -->
    <script src="boya_data.js"></script>
    <script src="../shared/progress.js"></script>
    <script src="boya_learning.js"></script>

</body>
</html>
