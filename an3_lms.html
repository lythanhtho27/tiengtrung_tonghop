":"Đợi nhé, tôi sẽ mở cửa sổ.","exp":"Quyết định được đưa ra ngay lúc nói → will.","tip":"Spontaneous decision → will + V.","note":"Spontaneous decision → will + V.","section":"Unit 1 - Exercise 4","passage":"","id":26,"instruction":"Choose the correct answer.","source_order":26},{"type":"mcq","stem":"I _____ the tickets on Friday.","options":["was buying","bought","have bought","buyed"],"answer":1,"vi":"Tôi đã mua vé vào thứ Sáu.","exp":"Mốc quá khứ xác định → Past Simple.","tip":"On Friday trong ngữ cảnh quá khứ → V2.","note":"On Friday trong ngữ cảnh quá khứ → V2.","section":"Unit 1 - Exercise 4","passage":"","id":27,"instruction":"Choose the correct answer.","source_order":27},{"type":"mcq","stem":"I _____ in this village all my life.","options":["live","‘m living","‘ve lived","was lived"],"answer":2,"vi":"Tôi đã sống ở làng này suốt đời.","exp":"Từ quá khứ đến hiện tại → Present Perfect.","tip":"All my life → have/has + V3.","note":"All my life → have/has + V3.","section":"Unit 1 - Exercise 4","passage":"","id":28,"instruction":"Choose the correct answer.","source_order":28},{"type":"mcq","stem":"A: \"Why are you so dirty?\" B: \"Because I _____ the basement.\"","options":["clean","‘ve leaned","‘ve been cleaning","cleaning"],"answer":2,"vi":"Vì tôi vừa dọn tầng hầm.","exp":"Kết quả hiện tại của hoạt động kéo dài → Present Perfect Continuous.","tip":"Have/has been + V-ing.","note":"Have/has been + V-ing.","section":"Unit 1 - Exercise 4","passage":"","id":29,"instruction":"Choose the correct answer.","source_order":29},{"type":"mcq","stem":"Tom lives in a mansion. He _____ rich.","options":["must be","should be","can be","isn’t"],"answer":0,"vi":"Tom sống trong biệt thự; anh ấy hẳn là giàu.","exp":"Suy luận chắc chắn ở hiện tại → must be.","tip":"Must + V = suy đoán mạnh.","note":"Must + V = suy đoán mạnh.","section":"Unit 1 - Exercise 4","passage":"","id":30,"instruction":"Choose the correct answer.","source_order":30},{"type":"mcq","stem":"I went into the room and the computer wasn't there. Somebody _____ it.","options":["took","was talking","had taken","was taken"],"answer":2,"vi":"Ai đó đã lấy máy tính trước khi tôi vào phòng.","exp":"Hành động lấy xảy ra trước mốc quá khứ 'went' → Past Perfect.","tip":"Had + V3 cho hành động xảy ra trước một hành động quá khứ khác.","note":"Had + V3 cho hành động xảy ra trước một hành động quá khứ khác.","section":"Unit 1 - Exercise 4","passage":"","id":31,"instruction":"Choose the correct answer.","source_order":31},{"type":"mcq","stem":"Did you remember _____ the door when you left?","options":["lock","to lock","locking","to locking"],"answer":1,"vi":"Bạn có nhớ khóa cửa khi rời đi không?","exp":"Remember to V = nhớ phải làm việc gì.","tip":"Remember to do (việc chưa làm); remember doing (nhớ đã làm).","note":"Remember to do (việc chưa làm); remember doing (nhớ đã làm).","section":"Unit 1 - Exercise 4","passage":"","id":32,"instruction":"Choose the correct answer.","source_order":32},{"type":"mcq","stem":"He opened a restaurant _____ not having a license.","options":["in spite","despite","however","although"],"answer":1,"vi":"Anh ấy mở nhà hàng mặc dù không có giấy phép.","exp":"Despite + noun/V-ing; 'in spite' phải có 'of'.","tip":"Despite + V-ing; in spite of + V-ing.","note":"Despite + V-ing; in spite of + V-ing.","section":"Unit 1 - Exercise 4","passage":"","id":33,"instruction":"Choose the correct answer.","source_order":33},{"type":"mcq","stem":"My Christmas present was very _____. I got a pair of socks.","options":["amazing","amazed","disappointing","disappointed"],"answer":2,"vi":"Quà Giáng sinh rất đáng thất vọng.","exp":"Vật gây cảm xúc dùng tính từ -ing.","tip":"Thing → -ing; person feels → -ed.","note":"Thing → -ing; person feels → -ed.","section":"Unit 1 - Exercise 4","passage":"","id":34,"instruction":"Choose the correct answer.","source_order":34},{"type":"mcq","stem":"We had only one hour, but we _____ the report on time.","options":["could finish","were able to finish","can finish","were finished"],"answer":1,"vi":"Chúng tôi chỉ có một giờ nhưng đã hoàn thành báo cáo đúng hạn.","exp":"Thành công trong một tình huống cụ thể ở quá khứ → was/were able to.","tip":"Specific past achievement → was/were able to.","note":"Specific past achievement → was/were able to.","section":"Unit 1 - Exercise 4","passage":"","id":35,"instruction":"Choose the correct answer.","source_order":35}]},{"id":"unit2","title":"UNIT 2 - LMS PRACTICE","questions":[{"type":"mcq","stem":"I ________ and my legs are really tired now.","options":["have been cycling","have cycled","had been cycling","had cycled"],"answer":0,"vi":"Tôi đã đạp xe nên chân rất mỏi.","exp":"Kết quả hiện tại của hoạt động kéo dài → Present Perfect Continuous.","tip":"Have been + V-ing khi nhấn mạnh hoạt động và kết quả hiện tại.","note":"Have been + V-ing khi nhấn mạnh hoạt động và kết quả hiện tại.","section":"Unit 2 - Exercise 1","passage":"","id":1,"instruction":"Choose the correct answer.","source_order":1},{"type":"mcq","stem":"I'm sorry I'm late, ________ for a long time?","options":["have you waited","had you waiting","have you been waiting","have you waited"],"answer":2,"vi":"Xin lỗi vì đến muộn, bạn đã chờ lâu chưa?","exp":"Hành động chờ kéo dài đến hiện tại → Present Perfect Continuous.","tip":"How long + have/has + S + been + V-ing?","note":"How long + have/has + S + been + V-ing?","section":"Unit 2 - Exercise 1","passage":"","id":2,"instruction":"Choose the correct answer.","source_order":2},{"type":"mcq","stem":"Somebody ________ my cookies. There are very few left.","options":["has been eating","has eaten","had been eating","had eaten"],"answer":0,"vi":"Ai đó đã ăn bánh quy của tôi; chỉ còn rất ít.","exp":"Nhấn mạnh hoạt động lặp lại gây kết quả hiện tại.","tip":"Evidence/result now → has been V-ing.","note":"Evidence/result now → has been V-ing.","section":"Unit 2 - Exercise 1","passage":"","id":3,"instruction":"Choose the correct answer.","source_order":3},{"type":"mcq","stem":"She must be tired. She ________ all afternoon.","options":["has been working","has worked","worked","works"],"answer":0,"vi":"Cô ấy hẳn mệt vì đã làm việc cả buổi chiều.","exp":"Nhấn mạnh thời lượng và kết quả mệt.","tip":"All afternoon + current result → Present Perfect Continuous.","note":"All afternoon + current result → Present Perfect Continuous.","section":"Unit 2 - Exercise 1","passage":"","id":4,"instruction":"Choose the correct answer.","source_order":4},{"type":"mcq","stem":"I ________ all afternoon. I have read 5 chapters.","options":["read","have read","am reading","have been reading"],"answer":3,"vi":"Tôi đã đọc cả buổi chiều và đã đọc được 5 chương.","exp":"Hoạt động kéo dài dùng Present Perfect Continuous; kết quả số lượng dùng Present Perfect.","tip":"Duration → have been reading; completed quantity → have read.","note":"Duration → have been reading; completed quantity → have read.","section":"Unit 2 - Exercise 1","passage":"","id":5,"instruction":"Choose the correct answer.","source_order":5},{"type":"mcq","stem":"They ________ for months, and they have visited three countries so far.","options":["travel","travelled","have been travelling","have travelled"],"answer":2,"vi":"Họ đã đi du lịch nhiều tháng và đã thăm ba quốc gia.","exp":"Nhấn mạnh quá trình kéo dài.","tip":"For months → have been V-ing.","note":"For months → have been V-ing.","section":"Unit 2 - Exercise 1","passage":"","id":6,"instruction":"Choose the correct answer.","source_order":6},{"type":"mcq","stem":"I ________ the book you lent me and it's great. I'll give it back to you when I finish it.","options":["have read","was read","have been reading","had read"],"answer":2,"vi":"Tôi đang đọc cuốn sách bạn cho mượn và nó rất hay.","exp":"Chưa đọc xong ('when I finish') → Present Perfect Continuous.","tip":"Unfinished ongoing activity → have been reading.","note":"Unfinished ongoing activity → have been reading.","section":"Unit 2 - Exercise 1","passage":"","id":7,"instruction":"Choose the correct answer.","source_order":7},{"type":"mcq","stem":"Bruce ________ tennis since he was a child. He ______ many trophies.","options":["has been playing / has won","is playing / has won","has played / has been winning","had played / had been winning"],"answer":0,"vi":"Bruce chơi tennis từ nhỏ và đã giành nhiều cúp.","exp":"Hoạt động kéo dài + kết quả hoàn thành.","tip":"Since → has been playing; quantity/result → has won.","note":"Since → has been playing; quantity/result → has won.","section":"Unit 2 - Exercise 1","passage":"","id":8,"instruction":"Choose the correct answer.","source_order":8},{"type":"mcq","stem":"You ________ tennis since 10 o'clock. How many sets ________?","options":["have played / have you been playing","have been playing / have you played","are playing / have you played","had playing / havd you played"],"answer":1,"vi":"Bạn đã chơi tennis từ 10 giờ. Bạn đã chơi bao nhiêu séc?","exp":"Quá trình dùng continuous, số lượng dùng simple.","tip":"Duration vs completed number.","note":"Duration vs completed number.","section":"Unit 2 - Exercise 1","passage":"","id":9,"instruction":"Choose the correct answer.","source_order":9},{"type":"mcq","stem":"He ________ to me since we met last summer. He ________ over 100 emails.","options":["is writing / has sent","was writing / wrote","has writing / has been sending","has been writing / has sent"],"answer":3,"vi":"Anh ấy viết thư cho tôi từ mùa hè trước và đã gửi hơn 100 email.","exp":"Quá trình liên tục + kết quả số lượng.","tip":"Has been writing / has sent.","note":"Has been writing / has sent.","section":"Unit 2 - Exercise 1","passage":"","id":10,"instruction":"Choose the correct answer.","source_order":10},{"type":"mcq","stem":"The estate agent persuaded him ________ his house for a very low price.","options":["to sell","sell","selling","sells"],"answer":0,"vi":"Môi giới thuyết phục anh ấy bán nhà.","exp":"Persuade + object + to V.","tip":"Persuade/advise/ask + O + to V.","note":"Persuade/advise/ask + O + to V.","section":"Unit 2 - Exercise 2","passage":"","id":11,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":11},{"type":"mcq","stem":"I need someone ________ me carry these bags to the car.","options":["help","helps","to help","helping"],"answer":2,"vi":"Tôi cần ai đó giúp mang túi ra xe.","exp":"Need someone to do.","tip":"Someone + to V.","note":"Someone + to V.","section":"Unit 2 - Exercise 2","passage":"","id":12,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":12},{"type":"mcq","stem":"My financial adviser advised me not ________ all my money in shares.","options":["invest","to invest","to be invested","investing"],"answer":1,"vi":"Cố vấn khuyên tôi không đầu tư toàn bộ tiền vào cổ phiếu.","exp":"Advise + O + not to V.","tip":"Not đặt trước to V trong lời khuyên phủ định.","note":"Not đặt trước to V trong lời khuyên phủ định.","section":"Unit 2 - Exercise 2","passage":"","id":13,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":13},{"type":"mcq","stem":"Let me ________ myself – I'm Patrick.","options":["introduce","to introduce","introducing","introduced"],"answer":0,"vi":"Hãy để tôi tự giới thiệu.","exp":"Let + object + bare infinitive.","tip":"Let/make + O + V nguyên mẫu không 'to'.","note":"Let/make + O + V nguyên mẫu không 'to'.","section":"Unit 2 - Exercise 2","passage":"","id":14,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":14},{"type":"mcq","stem":"Our Maths teacher always made us ________ extra homework if we failed a test.","options":["do","to do","doing","does"],"answer":0,"vi":"Giáo viên bắt chúng tôi làm thêm bài tập.","exp":"Make + O + bare infinitive.","tip":"Active: make somebody do; passive: be made to do.","note":"Active: make somebody do; passive: be made to do.","section":"Unit 2 - Exercise 2","passage":"","id":15,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":15},{"type":"mcq","stem":"Johnny asked his dad ________ his bike for him.","options":["fix","to fix","fixing","fixes"],"answer":1,"vi":"Johnny nhờ bố sửa xe đạp.","exp":"Ask + O + to V.","tip":"Ask somebody to do.","note":"Ask somebody to do.","section":"Unit 2 - Exercise 2","passage":"","id":16,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":16},{"type":"mcq","stem":"Because of the lack of labor, the government is allowing foreign workers ________ the country on a free 6-month visa.","options":["enter","enters","to enter","entering"],"answer":2,"vi":"Chính phủ cho phép lao động nước ngoài vào quốc gia.","exp":"Allow + O + to V.","tip":"Allow somebody to do.","note":"Allow somebody to do.","section":"Unit 2 - Exercise 2","passage":"","id":17,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":17},{"type":"mcq","stem":"I didn't expect Emma ________ my invitation. I was surprised that she came to the party.","options":["accept","to accept","accepting","accepted"],"answer":1,"vi":"Tôi không ngờ Emma chấp nhận lời mời.","exp":"Expect + O + to V.","tip":"Expect somebody to do.","note":"Expect somebody to do.","section":"Unit 2 - Exercise 2","passage":"","id":18,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":18},{"type":"mcq","stem":"Marta's mother won't let her ________ to school alone: she always walks there with her.","options":["go","goes","to go","going"],"answer":0,"vi":"Mẹ Marta không cho cô ấy đi học một mình.","exp":"Let + O + bare infinitive.","tip":"Let her go, không dùng 'to'.","note":"Let her go, không dùng 'to'.","section":"Unit 2 - Exercise 2","passage":"","id":19,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":19},{"type":"mcq","stem":"The shop assistant saw him ________ the book.","options":["steal","steals","to steal","stealing"],"answer":0,"vi":"Nhân viên thấy anh ta lấy trộm cuốn sách.","exp":"See + O + bare infinitive khi thấy trọn hành động.","tip":"See O do = thấy toàn bộ; see O doing = thấy đang diễn ra.","note":"See O do = thấy toàn bộ; see O doing = thấy đang diễn ra.","section":"Unit 2 - Exercise 2","passage":"","id":20,"instruction":"Choose the correct form of the verb to complete each sentence.","source_order":20},{"type":"mcq","stem":"She ________ here for five years.","options":["workes","worked","has worked","has been working"],"answer":3,"vi":"Cô ấy đã làm việc ở đây 5 năm.","exp":"Bài tập nhấn mạnh hoạt động kéo dài → Present Perfect Continuous.","tip":"For + thời gian, hành động còn tiếp diễn → has been V-ing.","note":"For + thời gian, hành động còn tiếp diễn → has been V-ing.","section":"Unit 2 - Exercise 3","passage":"","id":21,"instruction":"Choose the correct answer.","source_order":21},{"type":"mcq","stem":"We ________ in London for six months.","options":["live","has lived","has been living","lived"],"answer":2,"vi":"Chúng tôi đã sống ở London 6 tháng.","exp":"We + have been living.","tip":"Subject 'we' → have, không dùng has.","note":"Subject 'we' → have, không dùng has.","section":"Unit 2 - Exercise 3","passage":"","id":22,"instruction":"Choose the correct answer.","source_order":22},{"type":"mcq","stem":"He ________ football, so he's tired.","options":["plays","played","has played","has been playing"],"answer":3,"vi":"Anh ấy vừa chơi bóng nên mệt.","exp":"Kết quả hiện tại 'tired' cho thấy hoạt động vừa kéo dài.","tip":"Present Perfect Continuous for recent activity.","note":"Present Perfect Continuous for recent activity.","section":"Unit 2 - Exercise 3","passage":"","id":23,"instruction":"Choose the correct answer.","source_order":23},{"type":"mcq","stem":"They ________ English for two years.","options":["have been learning","had been leaning","have lived","had lived"],"answer":0,"vi":"Họ học tiếng Anh hai năm nay.","exp":"Hành động kéo dài đến hiện tại.","tip":"For two years → have been learning.","note":"For two years → have been learning.","section":"Unit 2 - Exercise 3","passage":"","id":24,"instruction":"Choose the correct answer.","source_order":24},{"type":"mcq","stem":"She ________ to the cinema every weekend for years.","options":["go","went","has been going","has gone"],"answer":2,"vi":"Cô ấy đã đi xem phim mỗi cuối tuần trong nhiều năm.","exp":"Thói quen lặp lại kéo dài đến hiện tại.","tip":"Repeated ongoing activity → has been going.","note":"Repeated ongoing activity → has been going.","section":"Unit 2 - Exercise 3","passage":"","id":25,"instruction":"Choose the correct answer.","source_order":25},{"type":"mcq","stem":"It ________; the pavement is wet.","options":["rain","has been raining","had been raining","rained"],"answer":1,"vi":"Trời vừa mưa; vỉa hè còn ướt.","exp":"Dấu hiệu hiện tại cho hoạt động vừa xảy ra.","tip":"Present evidence → has been raining.","note":"Present evidence → has been raining.","section":"Unit 2 - Exercise 3","passage":"","id":26,"instruction":"Choose the correct answer.","source_order":26},{"type":"mcq","stem":"They ________ here for very long.","options":["haven’t been living","hadn’t been living","have lived","had lived"],"answer":0,"vi":"Họ chưa sống ở đây lâu.","exp":"Mốc hiện tại + for very long → Present Perfect Continuous phủ định.","tip":"Haven't been + V-ing.","note":"Haven't been + V-ing.","section":"Unit 2 - Exercise 3","passage":"","id":27,"instruction":"Choose the correct answer.","source_order":27},{"type":"mcq","stem":"We ________ enough water - that's why we feel tired.","options":["have drunk","haven’t been drinking","had drunk","hadn’t been drinking"],"answer":1,"vi":"Chúng tôi chưa uống đủ nước nên mệt.","exp":"Nguyên nhân kéo dài đến hiện tại.","tip":"Not enough + current result → haven't been drinking.","note":"Not enough + current result → haven't been drinking.","section":"Unit 2 - Exercise 3","passage":"","id":28,"instruction":"Choose the correct answer.","source_order":28},{"type":"mcq","stem":"They ________ TV much recently.","options":["haven’t been watching","watch","to wach","are watching"],"answer":0,"vi":"Gần đây họ không xem TV nhiều.","exp":"Recently thường đi với Present Perfect.","tip":"Recently + ongoing habit → haven't been watching.","note":"Recently + ongoing habit → haven't been watching.","section":"Unit 2 - Exercise 3","passage":"","id":29,"instruction":"Choose the correct answer.","source_order":29},{"type":"mcq","stem":"I ________; I was reading.","options":["haven’t slept","hadn’t slept","am sleeping","haven't been sleeping"],"answer":3,"vi":"Tôi không ngủ; tôi đang đọc sách.","exp":"Theo ý bài, hành động không ngủ kéo dài đến hiện tại.","tip":"Have not been sleeping = gần đây không ngủ.","note":"Have not been sleeping = gần đây không ngủ.","section":"Unit 2 - Exercise 3","passage":"","id":30,"instruction":"Choose the correct answer.","source_order":30}]},{"id":"unit3","title":"UNIT 3 - LMS PRACTICE","questions":[{"type":"mcq","stem":"That door ________ yesterday.","options":["paint","painted","is painted","was painted"],"answer":3,"vi":"Cánh cửa đó được sơn hôm qua.","exp":"Bị động quá khứ: was + V3.","tip":"Yesterday + passive → was/were + V3.","note":"Yesterday + passive → was/were + V3.","section":"Unit 3 - Exercise 1","passage":"","id":1,"instruction":"Choose the correct answer.","source_order":1},{"type":"mcq","stem":"Michelangelo ________ the Sistine Chapel.","options":["paint","painted","is painted","was painted"],"answer":1,"vi":"Michelangelo đã vẽ Nhà nguyện Sistine.","exp":"Chủ ngữ thực hiện hành động → active Past Simple.","tip":"Person + V2 + object.","note":"Person + V2 + object.","section":"Unit 3 - Exercise 1","passage":"","id":2,"instruction":"Choose the correct answer.","source_order":2},{"type":"mcq","stem":"Michael Schumacher ________ for Ferrari in 2003.","options":["drive","drove","is driven","was driven"],"answer":1,"vi":"Schumacher lái cho Ferrari năm 2003.","exp":"Mốc quá khứ → drove.","tip":"In 2003 → Past Simple.","note":"In 2003 → Past Simple.","section":"Unit 3 - Exercise 1","passage":"","id":3,"instruction":"Choose the correct answer.","source_order":3},{"type":"mcq","stem":"Inter-city trains ________ by men.","options":["is usually driven","are usually driven","was usually driven","were usually driven"],"answer":1,"vi":"Tàu liên tỉnh thường được nam giới lái.","exp":"Chủ ngữ số nhiều, thói quen hiện tại, bị động.","tip":"Plural + are + adverb + V3.","note":"Plural + are + adverb + V3.","section":"Unit 3 - Exercise 1","passage":"","id":4,"instruction":"Choose the correct answer.","source_order":4},{"type":"mcq","stem":"The 'La Stampa' newspaper ________ by two million people in Italy.","options":["is read","are read","was read","were read"],"answer":0,"vi":"Báo La Stampa được hai triệu người đọc.","exp":"Newspaper số ít + is read.","tip":"Present Simple Passive: is/are + V3.","note":"Present Simple Passive: is/are + V3.","section":"Unit 3 - Exercise 1","passage":"","id":5,"instruction":"Choose the correct answer.","source_order":5},{"type":"mcq","stem":"The thieves ________ the gold last week.","options":["steal","stole","stolen","are stolen"],"answer":1,"vi":"Bọn trộm lấy vàng tuần trước.","exp":"Chủ ngữ thực hiện hành động, Past Simple.","tip":"Last week → V2.","note":"Last week → V2.","section":"Unit 3 - Exercise 1","passage":"","id":6,"instruction":"Choose the correct answer.","source_order":6},{"type":"mcq","stem":"The bridge ________ by the storm last night.","options":["is destroyed","to destroy","destroys","was destroyed"],"answer":3,"vi":"Cây cầu bị cơn bão phá hủy đêm qua.","exp":"Bị động quá khứ.","tip":"Last night + passive → was destroyed.","note":"Last night + passive → was destroyed.","section":"Unit 3 - Exercise 1","passage":"","id":7,"instruction":"Choose the correct answer.","source_order":7},{"type":"mcq","stem":"This letter ________, not handwritten!","options":["typed","should type","should be typed","should be typing"],"answer":2,"vi":"Lá thư này nên được đánh máy.","exp":"Modal passive: should be + V3.","tip":"Modal + be + past participle.","note":"Modal + be + past participle.","section":"Unit 3 - Exercise 1","passage":"","id":8,"instruction":"Choose the correct answer.","source_order":8},{"type":"mcq","stem":"The new secretary ________ at 100 wpm.","options":["to type","type","typing","types"],"answer":3,"vi":"Thư ký mới gõ 100 từ/phút.","exp":"Hiện tại đơn ngôi thứ ba → types.","tip":"Singular subject + V-s.","note":"Singular subject + V-s.","section":"Unit 3 - Exercise 1","passage":"","id":9,"instruction":"Choose the correct answer.","source_order":9},{"type":"mcq","stem":"I ________ Japanese when I was in Tokyo.","options":["learn","to learn","learnt","learning"],"answer":2,"vi":"Tôi đã học tiếng Nhật khi ở Tokyo.","exp":"Mốc quá khứ → learnt.","tip":"When I was... → Past Simple.","note":"When I was... → Past Simple.","section":"Unit 3 - Exercise 1","passage":"","id":10,"instruction":"Choose the correct answer.","source_order":10},{"type":"fill","stem":"Please turn off the stove ________ you finish cooking.","answers":["after"],"vi":"Hãy tắt bếp sau khi nấu xong.","exp":"Trình tự: hoàn tất nấu rồi tắt bếp.","tip":"After + Present Simple.","note":"After + Present Simple.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":11,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":11},{"type":"fill","stem":"________ she was studying, I did not want to disturb her.","answers":["While"],"vi":"Khi cô ấy đang học, tôi không muốn làm phiền.","exp":"While đi với hành động đang diễn ra.","tip":"While + Past Continuous.","note":"While + Past Continuous.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":12,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":12},{"type":"fill","stem":"He missed the beginning of the movie ________ he arrived late.","answers":["because"],"vi":"Anh ấy lỡ phần đầu phim vì đến muộn.","exp":"Mệnh đề sau nêu nguyên nhân.","tip":"Because + S + V.","note":"Because + S + V.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":13,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":13},{"type":"fill","stem":"You can open your gifts ________ everyone has eaten.","answers":["after"],"vi":"Bạn có thể mở quà sau khi mọi người ăn xong.","exp":"After diễn tả trình tự thời gian.","tip":"Future main clause + after + Present Perfect/Present Simple.","note":"Future main clause + after + Present Perfect/Present Simple.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":14,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":14},{"type":"fill","stem":"They decided to go hiking ________ it was raining.","answers":["even though"],"vi":"Họ vẫn đi bộ đường dài mặc dù trời mưa.","exp":"Ý tương phản → even though.","tip":"Even though + clause.","note":"Even though + clause.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":15,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":15},{"type":"fill","stem":"________ you leave, make sure to turn off all the lights.","answers":["Before"],"vi":"Trước khi rời đi, nhớ tắt đèn.","exp":"Before chỉ hành động phải làm trước.","tip":"Before + Present Simple.","note":"Before + Present Simple.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":16,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":16},{"type":"fill","stem":"________ I visit New York, I make sure to see a Broadway show.","answers":["Whenever"],"vi":"Mỗi khi đến New York, tôi luôn xem Broadway.","exp":"Whenever = bất cứ khi nào/mỗi khi.","tip":"Whenever + present for repeated events.","note":"Whenever + present for repeated events.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":17,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":17},{"type":"fill","stem":"________ the fish is in the bowl, chop the garlic and pepper.","answers":["once"],"vi":"Khi cá đã ở trong tô, hãy thái tỏi và tiêu.","exp":"Once = một khi/sau khi điều kiện hoàn tất.","tip":"Once + present, imperative/main clause.","note":"Once + present, imperative/main clause.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":18,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":18},{"type":"fill","stem":"Don't mix the onion with the fish ________ you remove it from the refrigerator.","answers":["Until"],"vi":"Đừng trộn hành với cá cho đến khi lấy cá khỏi tủ lạnh.","exp":"Not...until = không...cho đến khi.","tip":"Don't + V until + clause.","note":"Don't + V until + clause.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":19,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":19},{"type":"fill","stem":"________ you make the popcorn, you start the cheese sauce.","answers":["as soon as"],"vi":"Ngay khi làm bỏng ngô, bạn bắt đầu sốt phô mai.","exp":"As soon as = ngay khi.","tip":"As soon as + present.","note":"As soon as + present.","section":"Unit 3 - Exercise 2","passage":"","wordbank":["as soon as","Whenever","after","While","once","Before","because","Until","even though","after"],"id":20,"instruction":"Choose the word or phrase from the box to complete each sentence.","source_order":20},{"type":"mcq","stem":"Which sentence contains a correct future time clause?","options":["I will call you when I will arrive.","She studies hard because she wants to pass.","They will go to the park after they finish their homework.","He eats dinner before he goes to the gym."],"answer":2,"vi":"Câu đúng là: Họ sẽ đi công viên sau khi hoàn thành bài tập.","exp":"Trong mệnh đề thời gian tương lai không dùng will.","tip":"Main clause will + time clause Present Simple.","note":"Main clause will + time clause Present Simple.","section":"Unit 3 - Exercise 3","passage":"","id":21,"instruction":"Choose the correct answer about time clauses.","source_order":21},{"type":"mcq","stem":"What is the function of a time clause?","options":["To express a condition","To indicate time","To show contrast","To ask a question"],"answer":1,"vi":"Chức năng là chỉ thời gian.","exp":"Time clause cho biết khi nào hành động xảy ra.","tip":"Time clause answers when.","note":"Time clause answers when.","section":"Unit 3 - Exercise 3","passage":"","id":22,"instruction":"Choose the correct answer about time clauses.","source_order":22},{"type":"mcq","stem":"Which conjunction commonly introduces a time clause?","options":["Although","Because","When","Unless"],"answer":2,"vi":"When thường mở đầu mệnh đề thời gian.","exp":"When là liên từ thời gian.","tip":"Time conjunctions: when, before, after, while, until, once.","note":"Time conjunctions: when, before, after, while, until, once.","section":"Unit 3 - Exercise 3","passage":"","id":23,"instruction":"Choose the correct answer about time clauses.","source_order":23},{"type":"mcq","stem":"Identify the time clause in the following sentence: \"I will start cooking when I get home.\"","options":["I will start cooking","when I get home","I get home","start cooking"],"answer":1,"vi":"Mệnh đề thời gian là 'when I get home'.","exp":"Nó được mở đầu bằng liên từ when.","tip":"Time clause gồm conjunction + subject + verb.","note":"Time clause gồm conjunction + subject + verb.","section":"Unit 3 - Exercise 3","passage":"","id":24,"instruction":"Choose the correct answer about time clauses.","source_order":24},{"type":"mcq","stem":"Which sentence is incorrect because of a time-clause error?","options":["I will do my homework before dinner.","She will call you as soon as she arrives.","He went to bed after he finished his book.","They will leave when they will be ready."],"answer":3,"vi":"Câu sai dùng will trong mệnh đề when.","exp":"Phải là 'when they are ready'.","tip":"Không dùng will sau when/as soon as/before/after khi nói tương lai.","note":"Không dùng will sau when/as soon as/before/after khi nói tương lai.","section":"Unit 3 - Exercise 3","passage":"","id":25,"instruction":"Choose the correct answer about time clauses.","source_order":25},{"type":"mcq","stem":"Which sentence best illustrates a correct future time clause with 'once'?","options":["The teacher will explain the lesson when he arrives.","Maria was happy since she won.","Once I finish my work, I will go for a walk.","She will not go unless it stops raining."],"answer":2,"vi":"Một khi làm xong việc, tôi sẽ đi dạo.","exp":"Đáp án C dùng once + Present Simple và will ở mệnh đề chính.","tip":"Once + Present Simple, will + V.","note":"Once + Present Simple, will + V.","section":"Unit 3 - Exercise 3","passage":"","id":26,"instruction":"Choose the correct answer about time clauses.","source_order":26},{"type":"mcq","stem":"What is the primary purpose of a subordinate time clause?","options":["To add time detail to the main clause","To provide contrast","To summarize the main idea","To serve as the main idea"],"answer":0,"vi":"Mệnh đề thời gian bổ sung chi tiết về thời điểm cho mệnh đề chính.","exp":"Nó là mệnh đề phụ, không phải ý chính.","tip":"Subordinate clause modifies the main clause.","note":"Subordinate clause modifies the main clause.","section":"Unit 3 - Exercise 3","passage":"","id":27,"instruction":"Choose the correct answer about time clauses.","source_order":27},{"type":"mcq","stem":"Choose the correct option to complete the sentence: \"They usually play soccer _________ it stops raining.\"","options":["unless","as soon as","while","after"],"answer":1,"vi":"Họ thường chơi bóng ngay khi mưa tạnh.","exp":"As soon as diễn tả bắt đầu ngay sau một sự kiện.","tip":"As soon as = immediately after.","note":"As soon as = immediately after.","section":"Unit 3 - Exercise 3","passage":"","id":28,"instruction":"Choose the correct answer about time clauses.","source_order":28},{"type":"mcq","stem":"In the sentence \"I will go shopping before I clean the house,\" which part is the main clause?","options":["I will go shopping","before I clean the house","clean the house","I clean the house"],"answer":0,"vi":"Mệnh đề chính là 'I will go shopping'.","exp":"Nó có thể đứng độc lập và mang ý chính.","tip":"Main clause can stand alone.","note":"Main clause can stand alone.","section":"Unit 3 - Exercise 3","passage":"","id":29,"instruction":"Choose the correct answer about time clauses.","source_order":29},{"type":"mcq","stem":"Which of the following sentences includes a time clause in the correct format?","options":["She will only eat lunch when she feel hungry.","You can have dessert before you finish your dinner.","We can start the meeting after everyone arrives.","He will play video games as soon as he will finish homework."],"answer":2,"vi":"Chúng ta có thể bắt đầu cuộc họp sau khi mọi người đến.","exp":"Đáp án C đúng về hòa hợp và dùng hiện tại đơn sau after.","tip":"After + Present Simple; everyone + arrives.","note":"After + Present Simple; everyone + arrives.","section":"Unit 3 - Exercise 3","passage":"","id":30,"instruction":"Choose the correct answer about time clauses.","source_order":30}]},{"id":"unit4","title":"UNIT 4 - LMS PRACTICE","questions":[{"type":"mcq","stem":"If I (be) ________ you, I (get) ________ a new job.","options":["were / would get","were / would got","am / will get","am / would get"],"answer":0,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"If I were you là cấu trúc điều kiện loại 2.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":1,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":1},{"type":"mcq","stem":"If he (be) ________ younger, he (travel) ________ more.","options":["is / travels","was / would travel","is / will travel","was / travel"],"answer":1,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Điều kiện giả định hiện tại: Past Simple + would V.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":2,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":2},{"type":"mcq","stem":"If we (not/be) ________ friends, I (be) ________ angry with you.","options":["aren’t / am","aren’t / would be","weren’t / would be","weren’t / wouldn’t"],"answer":2,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Weren't + would be.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":3,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":3},{"type":"mcq","stem":"If I (have) ________ enough money, I (buy) ________ a big house.","options":["have / would buy","had / would buy","had / wouldn’t buy","hadn’t / wouldn’t"],"answer":1,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Had + would buy.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":4,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":4},{"type":"mcq","stem":"If she (not/be) ________ always so late, she (be) ________ promoted.","options":["isn’t / is","wasn’t / isn’t","wasn’t / wouldn’t","wasn’t / would be"],"answer":3,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Wasn't + would be.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":5,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":5},{"type":"mcq","stem":"If we (have) ________ a better job, we (be) ________ able to buy a new car.","options":["had / would be","hadn’t / wouldn’t","have / will be","haven’t / won’t be"],"answer":0,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Had + would be.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":6,"instruction":"Choose the correct verb forms to complete the conditional sentences.","source_order":6},{"type":"mcq","stem":"If you (have) ________ a better job, we (be) ________ able to buy a new car.","options":["have / are","have / will be","have / would be","had / would be"],"answer":3,"vi":"Câu điều kiện loại 2 diễn tả tình huống giả định ở hiện tại.","exp":"Giả định hiện tại: had / would be.","tip":"If + Past Simple, would + V nguyên mẫu.","note":"If + Past Simple, would + V nguyên mẫu.","section":"Unit 4 - Exercise 1","passage":"","id":7,"instruction":"Choose the correct verb forms to complete the let S={set:null,order:[],i:0,a:Object.create(null),mode:"test",start:0,marks:new Set(),nav:[],timer:null};
const $=id=>document.getElementById(id),norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[.,!?;:]+$/g,"").replace(/\s+/g," ").trim();
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function home(){const f=document.createDocumentFragment();DATA.sets.forEach(s=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<h2>${s.title}</h2><p>${s.questions.length} câu - Trắc nghiệm và điền từ</p><span class=pill>Grammar</span><span class=pill>Vocabulary</span><span class=pill>Fill-in</span><br><br><button class="btn primary" data-id="${s.id}" data-mode="test">Làm bài</button> <button class=btn data-id="${s.id}" data-mode="answer">Xem đáp án</button>`;f.appendChild(d)});$("sets").replaceChildren(f)}
function view(v){$("home").style.display=v==="home"?"block":"none";$("quiz").style.display=v==="quiz"?"block":"none";$("result").style.display=v==="result"?"block":"none";$("head").style.display=v==="quiz"?"block":"none"}
function start(id,m){S.set=DATA.sets.find(x=>x.id===id);S.order=S.set.questions.slice().sort((a,b)=>a.source_order-b.source_order);S.i=0;S.a=Object.create(null);S.mode=m;S.start=Date.now();S.marks=new Set();$("title").textContent=S.set.title;$("mode").textContent=m==="test"?"Xem đáp án":"Làm bài";buildNav();view("quiz");clearInterval(S.timer);S.timer=setInterval(clock,1000);render(true)}
function clock(){let n=((Date.now()-S.start)/1000)|0;$("time").textContent=String((n/60)|0).padStart(2,"0")+":"+String(n%60).padStart(2,"0")}
function buildNav(){const f=document.createDocumentFragment();S.nav=[];S.order.forEach((q,i)=>{let b=document.createElement("button");b.className="n";b.textContent=i+1;b.dataset.i=i;S.nav.push(b);f.appendChild(b)});$("navgrid").replaceChildren(f)}
function check(q,v){return q.answers.some(a=>norm(a)===norm(v))}
function render(top=false){const q=S.order[S.i],sel=S.a[q.id];$("section").textContent=q.section;$("secstat").textContent=q.section;$("instruction").textContent=q.instruction||"";$("instruction").style.display=q.instruction?"block":"none";$("num").textContent=`Câu ${S.i+1}/${S.order.length} - Câu gốc ${q.id}`;$("mark").textContent=S.marks.has(q.id)?"★":"☆";$("mark").classList.toggle("on",S.marks.has(q.id));$("stem").textContent=q.stem;
const area=$("answerarea"),f=document.createDocumentFragment();if(q.type==="mcq"){const w=document.createElement("div");w.className="opts";q.options.forEach((o,k)=>{let b=document.createElement("button");b.className="opt";b.dataset.k=k;b.innerHTML=`<b>${String.fromCharCode(65+k)}.</b><span>${o}</span>`;if(S.mode==="answer"){b.classList.add("locked");if(k===q.answer)b.classList.add("correct")}else if(sel!==undefined){b.classList.add("locked");if(k===q.answer)b.classList.add("correct");if(k===sel&&sel!==q.answer)b.classList.add("wrong")}w.appendChild(b)});f.appendChild(w)}else{const box=document.createElement("div");box.className="fillbox";if(q.wordbank&&q.wordbank.length){let wb=document.createElement("div");wb.className="wordbank";wb.innerHTML="<b>Word bank:</b> "+q.wordbank.map(x=>`<span>${x}</span>`).join("");box.appendChild(wb)}let inp=document.createElement("input");inp.className="fillinput";inp.placeholder="Nhập đáp án...";inp.value=sel===undefined?"":sel;inp.dataset.fill="1";if(S.mode==="answer"){inp.value=q.answers[0];inp.disabled=true;inp.classList.add("correct")}else if(sel!==undefined){inp.disabled=true;inp.classList.add(check(q,sel)?"correct":"wrong")}box.appendChild(inp);if(S.mode==="test"&&sel===undefined){let ck=document.createElement("button");ck.className="btn primary";ck.textContent="Kiểm tra đáp án";ck.dataset.checkfill="1";box.appendChild(ck)}f.appendChild(box)}area.replaceChildren(f);if(S.mode==="answer"||sel!==undefined)feedback(q,sel);else{$("fb").className="fb";$("fb").textContent=""}$("prev").disabled=S.i===0;$("next").textContent=S.i===S.order.length-1?"Xem kết quả":"Tiếp →";stats();nav();if(top)scrollTo(0,0)}
function feedback(q,sel){let ok=q.type==="mcq"?(sel===q.answer||S.mode==="answer"):(check(q,sel)||S.mode==="answer"),ans=q.type==="mcq"?`${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`:q.answers[0];$("fb").className="fb show";$("fb").innerHTML=`<div class="${ok?"good":"bad"}">${ok?"✓ Chính xác":"✗ Chưa đúng"} - ${ans}</div><b>Dịch nghĩa:</b> ${q.vi}<br><b>Giải thích:</b> ${q.exp}<div class=note><b>Ghi nhớ:</b> ${q.tip}</div>`}
function pick(k){let q=S.order[S.i];if(S.mode==="answer"||S.a[q.id]!==undefined)return;S.a[q.id]=k;render()}
function submitFill(){let q=S.order[S.i],inp=document.querySelector("[data-fill]");if(!inp||!inp.value.trim())return alert("Hãy nhập đáp án.");S.a[q.id]=inp.value;render()}
function stats(){let d=Object.keys(S.a).length,c=0;S.set.questions.forEach(q=>{if(S.a[q.id]!==undefined&&(q.type==="mcq"?S.a[q.id]===q.answer:check(q,S.a[q.id])))c++});$("done").textContent=`Đã làm: ${d}/${S.set.questions.length}`;$("right").textContent=`Đúng: ${c}`;$("wrong").textContent=`Sai: ${d-c}`;$("bar").style.transform=`scaleX(${d/S.set.questions.length})`}
function nav(){S.nav.forEach((b,i)=>{let q=S.order[i];b.className="n";if(S.a[q.id]!==undefined)b.classList.add(q.type==="mcq"?(S.a[q.id]===q.answer?"c":"w"):(check(q,S.a[q.id])?"c":"w"));if(i===S.i)b.classList.add("now")})}
function go(i){if(i<0||i>=S.order.length)return;S.i=i;render();scrollTo(0,0)}
function finish(){clearInterval(S.timer);let c=0,w=[];S.set.questions.forEach(q=>{let ok=S.a[q.id]!==undefined&&(q.type==="mcq"?S.a[q.id]===q.answer:check(q,S.a[q.id]));if(ok)c++;else w.push(q)});view("result");$("score").textContent=`${c}/${S.set.questions.length} - ${Math.round(c/S.set.questions.length*100)}%`;$("remark").textContent=c/S.set.questions.length>=.8?"Rất tốt!":c/S.set.questions.length>=.6?"Khá tốt, hãy ôn lại câu sai.":"Cần ôn kỹ thêm.";const f=document.createDocumentFragment();w.slice(0,50).forEach(q=>{let d=document.createElement("div");d.className="reviewitem";let ans=q.type==="mcq"?`${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`:q.answers[0];d.innerHTML=`<b>Câu ${q.id}:</b> ${q.stem}<br><span style="color:#1267a7">Đáp án: ${ans}</span><br><small>${q.tip}</small>`;f.appendChild(d)});$("reviewlist").replaceChildren(f);$("retry").onclick=()=>{S.order=sh(w);S.a=Object.create(null);S.i=0;buildNav();view("quiz");render(true)}}
$("sets").onclick=e=>{let b=e.target.closest("[data-id]");if(b)start(b.dataset.id,b.dataset.mode)};$("answerarea").onclick=e=>{let b=e.target.closest(".opt");if(b)pick(+b.dataset.k);if(e.target.closest("[data-checkfill]"))submitFill()};$("answerarea").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-fill]"))submitFill()});$("navgrid").onclick=e=>{let b=e.target.closest(".n");if(b)go(+b.dataset.i)};$("prev").onclick=()=>go(S.i-1);$("next").onclick=()=>S.i<S.order.length-1?go(S.i+1):finish();$("mark").onclick=()=>{let id=S.order[S.i].id;S.marks.has(id)?S.marks.delete(id):S.marks.add(id);render()};$("mix").onclick=()=>{S.order=sh(S.order);S.i=0;buildNav();render(true)};$("mode").onclick=()=>{S.mode=S.mode==="test"?"answer":"test";$("mode").textContent=S.mode==="test"?"Xem đáp án":"Làm bài";render()};$("reset").onclick=()=>{if(confirm("Làm lại từ đầu?"))start(S.set.id,S.mode)};function goHome(){clearInterval(S.timer);S.set=null;view("home");scrollTo(0,0)}$("homeb").onclick=$("rh").onclick=goHome;$("review").onclick=()=>{S.mode="answer";buildNav();view("quiz");render(true)};home();view("home");
</script></body></html>
