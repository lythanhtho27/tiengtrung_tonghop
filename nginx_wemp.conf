# ==============================================================================
# CẤU HÌNH NGINX CHO WORD LEARNING TRÊN WEMP (WINDOWS + NGINX + MARIADB + PHP)
# Chạy song song và không gây xung đột với Moodle
# ==============================================================================

# ------------------------------------------------------------------------------
# CÁCH 1 (KHUYÊN DÙNG): Chạy subpath trên cùng cổng với Moodle (https://localhost/word_learning)
# Cách thực hiện:
# 1. Copy file này hoặc tạo file D:/wemp/nginx/conf/word_learning với nội dung dưới đây:
# 2. Thêm dòng: include word_learning; vào bên trong block "server { listen 443 ssl; ... }"
#    của file D:/wemp/nginx/conf/nginx.conf (ngay dưới dòng "include phpmyadmin;")
# ------------------------------------------------------------------------------

location ^~ /word_learning {
    alias "D:/Tho/HSK/Chuan HSK/BOYA/boya_tonghop_html";
    index index.php index.html;

    # Xử lý script PHP chuyển tới PHP FastCGI của WEMP
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $request_filename;
        include        fastcgi_params;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }
}


