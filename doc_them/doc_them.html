<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc thêm</title>
    <meta name="description" content="Đọc thêm tiếng Trung theo cấp HSK: bài đọc, truyện dài, hội thoại, thành ngữ, đề luyện đọc HSK, bài tự dán và bài khóa Boya: pinyin, chạm để tra, nghe, nhập vai, đọc tính giờ.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/theme.css">
    <script src="../shared/theme.js"></script>
    <script src="../shared/sync.js"></script>
    <script src="../shared/tts.js"></script>
    <link rel="stylesheet" href="doc_them.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="back" id="btn-back" href="../index.html" title="Về trang chủ">←</a>
            <div class="brand"><strong id="brand-title">Đọc thêm</strong><small id="brand-sub">Bài đọc · Truyện · Hội thoại · Thành ngữ · Luyện thi</small></div>
            <button class="account-btn" data-hoc-account type="button">Đăng nhập</button>
            <button class="ui-voice-btn" data-hoc-voice title="Giọng đọc (chọn giọng, luân phiên, đọc nhập vai)" aria-label="Giọng đọc">🔊</button>
            <button class="ui-theme-toggle" data-ui-theme-toggle title="Đổi giao diện sáng / tối" aria-label="Đổi giao diện sáng / tối"></button>
        </div>
    </header>

    <!-- ================= Danh sách (4 tab) ================= -->
    <main class="container" id="list-view">
        <nav class="tabs" role="tablist">
            <button class="tab" data-tab="lib" role="tab">📚 Thư viện</button>
            <button class="tab" data-tab="mine" role="tab">✍️ Bài của tôi</button>
            <button class="tab" data-tab="boya" role="tab">📖 Bài khóa đã học</button>
            <button class="tab" data-tab="exam" role="tab">📝 Luyện thi HSK</button>
        </nav>

        <!-- Tab 1: Thư viện -->
        <section id="tab-lib" class="tab-pane">
            <div class="summary card" id="lib-summary"></div>
            <details class="card foryou" id="lib-foryou" hidden></details>
            <details class="card cm-showcase" id="lib-comics" hidden></details>
            <div class="chips kinds" id="lib-kinds"></div>
            <div class="lib-tools">
                <input type="search" id="lib-search" placeholder="🔎 Tìm theo tiêu đề (Trung / Việt), chủ đề, thành ngữ…" aria-label="Tìm bài" autocomplete="off">
            </div>
            <div class="chips" id="lib-levels"></div>
            <div class="text-list" id="lib-list"></div>
        </section>

        <!-- Tab 2: Bài của tôi -->
        <section id="tab-mine" class="tab-pane" hidden>
            <form class="card mine-form" id="mine-form" autocomplete="off">
                <h2 id="mine-form-title">Dán bài mới</h2>
                <label class="field">Tiêu đề
                    <input type="text" id="mine-title" maxlength="120" placeholder="Ví dụ: Tin tức hôm nay">
                </label>
                <label class="field">Nội dung tiếng Trung <small class="muted">(mỗi dòng là một đoạn)</small>
                    <textarea id="mine-text" rows="7" placeholder="粘贴中文文章……"></textarea>
                </label>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit" id="mine-save">💾 Lưu bài</button>
                    <button class="btn" type="button" id="mine-cancel" hidden>Hủy sửa</button>
                    <span class="muted small" id="mine-count"></span>
                </div>
            </form>
            <div class="text-list" id="mine-list"></div>
        </section>

        <!-- Tab 3: Bài khóa Boya đã học -->
        <section id="tab-boya" class="tab-pane" hidden>
            <div id="boya-list"></div>
        </section>

        <!-- Tab 4: Luyện thi HSK -->
        <section id="tab-exam" class="tab-pane" hidden>
            <div class="summary card" id="exam-summary"></div>
            <div class="chips" id="exam-levels"></div>
            <div class="text-list" id="exam-list"></div>
        </section>
    </main>

    <!-- ================= Trình đọc ================= -->
    <main class="reader-wrap" id="reader-view" hidden>
        <div class="toolbar" id="toolbar" role="toolbar" aria-label="Công cụ đọc">
            <button class="tb" id="tb-py" title="Pinyin: tất cả / chỉ trên từ chưa học / tắt"><b class="cn">拼</b> <span id="tb-py-label">Pinyin</span></button>
            <button class="tb" id="tb-smaller" title="Chữ nhỏ hơn">A−</button>
            <button class="tb" id="tb-bigger" title="Chữ lớn hơn">A+</button>
            <button class="tb" id="tb-new" title="Tô các chữ thuộc từ chưa học">🖍 <span>Từ mới</span></button>
            <button class="tb" id="tb-tr" title="Bản dịch: tắt / từng đoạn / tất cả">🇻🇳 <span id="tb-tr-label">Dịch</span></button>
            <button class="tb" id="tb-lookup" title="Chạm chữ để tra từ">🔍 <span>Tra</span></button>
            <button class="tb" id="tb-comic" title="Chế độ Truyện tranh (khung tranh minh họa + bong bóng thoại)">🎨 <span id="tb-comic-label">Truyện tranh</span></button>
            <button class="tb" id="tb-listen" title="Nghe cả bài">🔊 <span>Nghe</span></button>
            <button class="tb" id="tb-role" title="Đọc nhập vai: lời dẫn một giọng, lời thoại trong ngoặc kép hai giọng luân phiên"><span id="tb-role-ico">🎭</span> <span id="tb-role-label">Nhập vai</span></button>
            <button class="tb tb-voice" id="tb-voice" data-hoc-voice title="Chọn giọng Người dẫn / Vai 1 / Vai 2" aria-label="Chọn giọng đọc">⚙</button>
            <label class="tb tb-select" title="Tốc độ đọc">
                <select id="tb-rate">
                    <option value="0.6">0.6×</option>
                    <option value="0.75">0.75×</option>
                    <option value="0.9">0.9×</option>
                    <option value="1">1×</option>
                    <option value="1.15">1.15×</option>
                </select>
            </label>
            <button class="tb" id="tb-timer" title="Đọc tính giờ">⏱ <span id="tb-timer-label">Tính giờ</span></button>
        </div>

        <div class="reader" id="reader">
            <div class="timer-bar" id="timer-bar" hidden>
                <span>⏱ <b id="timer-clock">0:00</b> · đang đọc…</span>
                <label class="check small"><input type="checkbox" id="opt-autohide"> Ẩn pinyin khi tính giờ</label>
                <button class="btn btn-primary btn-sm" id="btn-timer-done">✓ Đọc xong</button>
                <button class="btn btn-ghost btn-sm" id="btn-timer-cancel" title="Hủy">✕</button>
            </div>
            <div class="play-bar" id="play-bar" hidden>
                <span id="play-text">Đang đọc…</span>
                <button class="btn btn-sm" id="btn-play-stop">■ Dừng</button>
            </div>

            <header class="doc-head">
                <div class="eyebrow" id="doc-eyebrow"></div>
                <h1 class="doc-title cn" id="doc-title"></h1>
                <div class="doc-sub" id="doc-sub"></div>
                <div class="doc-meta" id="doc-meta"></div>
            </header>
            <nav class="ser-nav" id="doc-sernav" hidden></nav>
            <div class="card dlg-bar" id="doc-dlg" hidden></div>
            <div class="card idiom" id="doc-idiom" hidden></div>

            <div id="doc-result"></div>
            <div class="card act-box" id="doc-active" hidden></div>
            <details class="card beyond" id="doc-beyond" hidden></details>
            <article class="doc-body" id="doc-body"></article>
            <section class="quiz" id="doc-quiz" hidden></section>
            <div class="doc-end" id="doc-end"></div>
        </div>
    </main>

    <!-- ================= Làm đề luyện thi ================= -->
    <main class="reader-wrap exam-wrap no-py" id="exam-view" hidden>
        <div class="toolbar ex-bar" role="toolbar" aria-label="Làm đề">
            <span class="ex-prog" id="ex-prog">Đã làm 0/0</span>
            <button class="tb" id="ex-timer" title="Bấm giờ (gợi ý ~1 phút/câu)">⏱ <span id="ex-timer-label">Bấm giờ</span></button>
            <button class="tb" id="ex-py" title="Bật/tắt pinyin"><b class="cn">拼</b></button>
            <button class="tb" id="ex-lk" title="Chạm chữ để tra từ">🔍</button>
            <button class="btn btn-primary btn-sm" id="ex-submit">📤 Nộp bài</button>
        </div>
        <div class="reader exam" id="exam-body"></div>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="../shared/progress.js"></script>
    <script src="../shared/mywords.js"></script>
    <script src="../shared/lookups.js"></script>
    <script src="../shared/sentences.js"></script>
    <script src="../shared/notes.js"></script>
    <script src="../shared/zizu.js"></script>
    <script src="../shared/visual.js"></script>
    <script src="../shared/lookup.js"></script>
    <script src="../shared/active.js"></script>
    <script src="doc_data.js"></script>
    <script src="comic_data.js"></script>
    <script src="comic_art.js"></script>
    <script src="doc_them.js"></script>
</body>
</html>
